[project]
name = "dty"
version = "0.1.0"
description = "Replication of Díez, Tombe & Yang (2026), 'Barriers Within Borders' — non-distance internal trade costs in Canada."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.13",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
